<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111317">
  <title>Ronin Trist — Reboot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600;700;800&display=swap');
    :root{--ink:#f5f0e6;--muted:#a7a59e;--bg:#111317;--panel:#1a1e23;--panel2:#232830;--line:#343b44;--red:#e55745;--lime:#b5d653;--gold:#f0b764;--blue:#78b6e5;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3c2632 0,transparent 35%),var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100vh}button{font:inherit;color:inherit;border:0;cursor:pointer}#app{width:min(100%,760px);margin:auto;padding:18px 14px 42px}.topbar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 24px}.brand{font-family:Fraunces,serif;font-weight:800;font-size:24px;letter-spacing:-1px}.brand small{display:block;color:var(--red);font-family:DM Mono,monospace;font-size:10px;letter-spacing:1.2px;margin-top:2px}.level{font-family:DM Mono,monospace;font-size:11px;color:var(--lime);background:#202818;padding:7px 10px;border-radius:99px}.hero{background:linear-gradient(135deg,#292028,#1b2329);border:1px solid #463b41;border-radius:var(--radius);padding:23px;overflow:hidden;position:relative}.hero:after{content:'☽';position:absolute;right:18px;top:-26px;font-size:130px;color:#e557451b}.eyebrow,.section-title{font:700 10px DM Mono,monospace;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}.resource{font:800 62px/1 Fraunces,serif;letter-spacing:-3px;margin:6px 0}.resource span{font:600 16px Manrope,sans-serif;letter-spacing:0;color:var(--muted);margin-left:4px}.hero p{color:var(--muted);font-size:13px;margin:0}.smoke{width:100%;padding:18px;margin-top:18px;border-radius:16px;background:var(--red);font-weight:800;font-size:18px;box-shadow:0 7px 0 #94372c;transition:transform .1s,box-shadow .1s}.smoke:active{transform:translateY(5px);box-shadow:0 2px 0 #94372c}.smoke small{display:block;font:10px DM Mono,monospace;opacity:.75;margin-top:4px}.tabs{display:flex;overflow:auto;gap:8px;margin:26px -14px 18px;padding:0 14px}.tab{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:999px;font-weight:700;font-size:12px}.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.screen{display:none}.screen.active{display:block}.grid{display:grid;gap:11px}.stats{grid-template-columns:repeat(3,1fr)}.stat,.card,.notice{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font:800 25px Fraunces,serif;margin:4px 0}.stat small,.card p{font-size:12px;color:var(--muted);margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 10px}.section-head span{font-size:12px;color:var(--muted)}.card{position:relative}.card h3{font:800 17px Fraunces,serif;margin:3px 0 6px}.card .tag{font:700 10px DM Mono,monospace;text-transform:uppercase;color:var(--gold)}.character{display:flex;gap:13px;align-items:center}.avatar{width:47px;height:47px;border-radius:14px;display:grid;place-items:center;background:#2c323b;font-size:25px;flex:none}.character .grow{flex:1}.unlock{font:700 10px DM Mono,monospace;color:var(--lime);margin-top:7px}.locked{opacity:.5;filter:grayscale(.65)}.mini-button{background:var(--panel2);border:1px solid #454d58;padding:9px 11px;border-radius:10px;font-size:12px;font-weight:800}.mini-button.good{background:var(--lime);border-color:var(--lime);color:#17200b}.mini-button:disabled{opacity:.4;cursor:not-allowed}.equipment{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{text-align:center;min-height:112px;padding:12px 7px}.slot .itemicon{font-size:26px;display:block;margin:6px 0}.slot b{font-size:11px;display:block}.slot small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.perk{border-left:3px solid var(--blue)}.perk.chosen{border-left-color:var(--lime);background:#20271c}.price{font:700 11px DM Mono,monospace;color:var(--gold);margin:9px 0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.event{border-color:#654957;background:linear-gradient(120deg,#2a2027,#1a1e23)}.event h3{font-size:20px}.choice{display:block;text-align:left;width:100%;margin-top:8px;padding:12px;border-radius:11px;background:#2a3038;border:1px solid #424b57;font-size:12px;font-weight:700}.choice:hover{border-color:var(--gold)}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 16px;font-size:12px;font-weight:800;z-index:4;transition:transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}.toast.show{transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:3;padding:18px;display:none;align-items:end;background:#000a}.modal.show{display:flex}.modal-box{background:#20252c;border:1px solid #4b5561;border-radius:24px 24px 16px 16px;padding:24px;width:min(100%,600px);margin:auto}.modal-box h2{font:800 28px/1.05 Fraunces,serif;margin:7px 0 10px}.modal-box p{color:var(--muted);font-size:14px;line-height:1.5}.modal-close{float:right;background:none;color:var(--muted);font-size:22px}.divider{height:1px;background:var(--line);margin:16px 0}.footer-note{font-size:11px;color:var(--muted);line-height:1.5;margin:16px 3px}.hidden{display:none}@media(min-width:600px){#app{padding-top:30px}.grid.two{grid-template-columns:1fr 1fr}.card{padding:17px}}
  </style>
</head>
<body>
<main id="app">
  <header class="topbar"><div class="brand">Ronin Trist<small>REBOOT · BETA DE BARRA</small></div><div class="level" id="levelLabel">NIVELL 1</div></header>
  <section class="hero">
    <div class="eyebrow">EL TEU RECURS VITAL</div><div class="resource" id="cigs">0 <span>calades</span></div>
    <p id="subline">El carrer no espera. La gent tampoc.</p>
    <button class="smoke" id="smokeButton">FER UNA CALADA <small>+1 calada · +1 XP</small></button>
  </section>
  <nav class="tabs" id="tabs"></nav>
  <section class="screen active" id="home"></section>
  <section class="screen" id="people"></section>
  <section class="screen" id="rpg"></section>
  <section class="screen" id="shop"></section>
  <p class="footer-note">Aquesta beta usa personatges-arquetip i dades separades del motor. Afegir-ne un és una sola entrada a <code>CHARACTERS</code>; afegir objectes, a <code>ITEMS</code>.</p>
</main>
<div class="modal" id="modal"><div class="modal-box" id="modalContent"></div></div><div class="toast" id="toast"></div>
<script>
// ─── CONTINGUT: afegeix personatges, objectes i perks aquí. ────────────────
const CHARACTERS = [
 {id:'ombra',name:"L'Ombra del Sofà",emoji:'🛋️',threshold:35,role:'companyia estable',intro:"Hi ha algú al sofà. No parla. Però d'alguna manera ho arregla tot.",choices:[['Respectar el silenci', {respect:1,xp:12,stat:'endurance',amount:1}],['Preguntar si està bé', {cigs:16,xp:8,stat:'charisma',amount:1}]]},
 {id:'vist',name:'La Filòsofa del Vist',emoji:'📱',threshold:140,role:'contacte improbable',intro:"Arriba, deixa una idea brillant a l'aire i mira el mòbil amb una intensitat preocupant.",choices:[['Seguir-li el rotllo', {cigs:28,xp:15,stat:'street',amount:1}],['Fer una pregunta honesta', {respect:2,xp:15,stat:'charisma',amount:1}]]},
 {id:'bartender',name:'El Cronista del Reina',emoji:'🍸',threshold:360,role:'font de rumors',intro:"Et parla del gel artesanal, d'una nit de 2018 i d'una persona que 'no és com abans'.",choices:[['Escoltar la història sencera', {xp:25,stat:'endurance',amount:2}],['Convidar a una cervesa', {cigs:-30,respect:3,xp:20,stat:'charisma',amount:1}]]},
 {id:'ronin',name:'El Ronin de V Rising',emoji:'⚔️',threshold:800,role:'aliat de final de partida',intro:"Diu que té una build perfecta. No especifica per a què, però és convincent.",choices:[['Demanar la build', {cigs:80,xp:24,stat:'street',amount:2}],['Proposar una aventura', {respect:4,xp:30,stat:'charisma',amount:2}]]}
];
const ITEMS = [
 {id:'cap',name:'Gorra de festa',emoji:'🧢',slot:'cap',cost:90,currency:'cigs',perk:'+1 Carisma en trobades',desc:'Va sobreviure a més d’una nit de les que calia.'},
 {id:'coat',name:'Jaqueta del Reina',emoji:'🧥',slot:'cos',cost:5,currency:'respect',perk:'-15% al cost de sortides',desc:'El personal et deixa passar sense fer preguntes.'},
 {id:'lighter',name:'Encenedor heretat',emoji:'🔥',slot:'accessori',cost:180,currency:'cigs',perk:'10% de calada crítica x5',desc:'Té la flama irregular i una història encara pitjor.'},
 {id:'tracksuit',name:'Xandall de diumenge',emoji:'🩳',slot:'cos',cost:130,currency:'cigs',perk:'Les pèrdues es redueixen un 25%',desc:'No és elegant. És una declaració de principis.'},
 {id:'ring',name:'Anell sospitós',emoji:'💍',slot:'accessori',cost:9,currency:'respect',perk:'Un reintentar per sessió',desc:'Ningú no recorda d’on va sortir.'}
];
const PERKS = [
 {id:'tongue',name:'Resposta enginyosa',level:2,desc:'+20% de respecte en decisions.',effect:'respect'},
 {id:'contacts',name:'Contactes',level:3,desc:'Els personatges apareixen 15% abans.',effect:'threshold'},
 {id:'survivor',name:'No era tan tard',level:4,desc:'La primera pèrdua de cada sessió es redueix.',effect:'loss'},
 {id:'passive',name:'Fum passiu',level:5,desc:'+1 calada addicional cada 8 clics.',effect:'passive'}
];
const DEFAULT = {cigs:0,xp:0,respect:0,stats:{charisma:1,street:1,endurance:1},seen:[],equipped:{cap:null,cos:null,accessori:null},owned:[],perks:[],clicks:0,lossShield:true};
let state = JSON.parse(localStorage.getItem('ronin-reboot-beta')||'null') || structuredClone(DEFAULT);
let activeTab='home';
const $=s=>document.querySelector(s); const money=n=>Math.max(0,Math.floor(n)).toLocaleString('ca-ES');
function save(){localStorage.setItem('ronin-reboot-beta',JSON.stringify(state))}
function level(){return Math.floor(state.xp/40)+1} function threshold(c){return Math.floor(c.threshold*(state.perks.includes('contacts')?.85:1))}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function statName(k){return({charisma:'Carisma',street:'Calle',endurance:'Aguant'})[k]}
function equipped(id){return Object.values(state.equipped).includes(id)}
function renderTabs(){const labels={home:'Avui',people:'Gent',rpg:'Ronin',shop:'Tenda'};$('#tabs').innerHTML=Object.entries(labels).map(([id,l])=>`<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()})}
function renderHome(){const available=CHARACTERS.filter(c=>state.cigs>=threshold(c)&&!state.seen.includes(c.id));const next=CHARACTERS.filter(c=>!state.seen.includes(c.id)).sort((a,b)=>threshold(a)-threshold(b))[0];$('#home').innerHTML=`
 <div class="grid stats"><div class="stat"><small>CARISMA</small><b>${state.stats.charisma}</b><small>diàlegs</small></div><div class="stat"><small>CALLE</small><b>${state.stats.street}</b><small>recursos</small></div><div class="stat"><small>AGUANT</small><b>${state.stats.endurance}</b><small>caos</small></div></div>
 <div class="section-head"><div class="section-title">El que passa avui</div><span>${state.respect} respecte</span></div>
 ${available.length?available.map(c=>`<article class="card event"><span class="tag">TROBALLA DISPONIBLE</span><h3>${c.emoji} ${c.name}</h3><p>Una presència familiar ha entrat a la teva nit.</p><button class="mini-button good" onclick="openEvent('${c.id}')">VEURE QUÈ PASSA</button></article>`).join(''):`<article class="notice"><b>Tranquil·litat sospitosa.</b><p>${next?`A ${money(Math.max(0,threshold(next)-state.cigs))} calades apareixerà ${next.name}.`:'Has conegut tothom. Potser és hora d’anar a dormir.'}</p></article>`}
 <div class="section-head"><div class="section-title">Rumb de la partida</div><span>${state.seen.length}/${CHARACTERS.length} trobades</span></div>
 <article class="card"><span class="tag">OBJECTIU DE SESSIÓ</span><h3>Construir una reputació dubtosa</h3><p>Guanya respecte, vesteix-te com si tinguessis un pla i descobreix qui apareix quan la nit s’allarga.</p></article>`}
function renderPeople(){const list=CHARACTERS.map(c=>{const open=state.cigs>=threshold(c),seen=state.seen.includes(c.id);return `<article class="card character ${open?'':'locked'}"><div class="avatar">${open?c.emoji:'?'}</div><div class="grow"><span class="tag">${open?c.role:'presència desconeguda'}</span><h3>${open?c.name:'Algú encara no ha aparegut'}</h3><p>${seen?'Ja forma part de la teva història.':open?'Sents que pot passar alguna cosa.':`Apareix a ${money(threshold(c))} calades.`}</p>${open&&!seen?'<div class="unlock">A PUNT DE TROBADA</div>':''}</div>${open&&!seen?`<button class="mini-button" onclick="openEvent('${c.id}')">PARLAR</button>`:''}</article>`}).join('');$('#people').innerHTML=`<div class="section-head"><div class="section-title">Personatges</div><span>Dades separades</span></div><div class="grid">${list}</div>`}
function renderRpg(){const slots=['cap','cos','accessori'];const labels={cap:'Cap',cos:'Cos',accessori:'Accessoris'};const equips=slots.map(slot=>{const item=ITEMS.find(i=>i.id===state.equipped[slot]);return `<article class="card slot"><small>${labels[slot]}</small><span class="itemicon">${item?.emoji||'—'}</span><b>${item?.name||'Buit'}</b><small>${item?.perk||'Sense efecte'}</small></article>`}).join('');const perks=PERKS.map(p=>{const can=level()>=p.level,chosen=state.perks.includes(p.id);return `<article class="card perk ${chosen?'chosen':''}"><span class="tag">NIVELL ${p.level}</span><h3>${p.name}</h3><p>${p.desc}</p><div class="row"><small>${chosen?'ACTIU':can?'Disponible':'Bloquejat'}</small><button class="mini-button ${chosen?'':'good'}" ${(!can||chosen)?'disabled':''} onclick="choosePerk('${p.id}')">${chosen?'TRIAT':'TRIAR'}</button></div></article>`}).join('');$('#rpg').innerHTML=`<div class="section-head"><div class="section-title">Equipament</div><span>3 espais</span></div><div class="equipment">${equips}</div><div class="section-head"><div class="section-title">Perks</div><span>Nivell ${level()} · ${state.xp%40}/40 XP</span></div><div class="grid two">${perks}</div>`}
function renderShop(){const cards=ITEMS.map(i=>{const own=state.owned.includes(i.id),afford=i.currency==='cigs'?state.cigs>=i.cost:state.respect>=i.cost;return `<article class="card"><span class="tag">${i.slot}</span><h3>${i.emoji} ${i.name}</h3><p>${i.desc}</p><div class="price">${i.cost} ${i.currency==='cigs'?'CALADES':'RESPECTE'}</div><p>${i.perk}</p><button class="mini-button ${own?'':'good'}" ${own?'disabled':''} onclick="buyItem('${i.id}')">${own?(equipped(i.id)?'EQUIPAT':'COMPRAT'):'COMPRAR I EQUIPAR'}</button></article>`}).join('');$('#shop').innerHTML=`<div class="section-head"><div class="section-title">La tenda que no factura</div><span>${state.cigs} calades · ${state.respect} respecte</span></div><div class="grid two">${cards}</div><p class="footer-note">Exemples de catàleg: els objectes són dades independents i es poden editar o ampliar sense tocar el motor.</p>`}
function render(){save();$('#cigs').innerHTML=`${money(state.cigs)} <span>calades</span>`;$('#levelLabel').textContent=`NIVELL ${level()}`;renderTabs();['home','people','rpg','shop'].forEach(id=>$('#'+id).classList.toggle('active',id===activeTab));renderHome();renderPeople();renderRpg();renderShop()}
function addClick(){let gain=1;if(state.equipped.accessori==='lighter'&&Math.random()<.1){gain=5;toast('FLAMA CRÍTICA · +5 calades')}state.cigs+=gain;state.xp++;state.clicks++;if(state.perks.includes('passive')&&state.clicks%8===0){state.cigs++;toast('Fum passiu · +1 calada')}render()}
function openEvent(id){const c=CHARACTERS.find(x=>x.id===id);$('#modalContent').innerHTML=`<button class="modal-close" onclick="closeModal()">×</button><span class="tag">${c.role}</span><h2>${c.emoji} ${c.name}</h2><p>${c.intro}</p><div class="divider"></div><div class="eyebrow">QUÈ FAS?</div>${c.choices.map((x,n)=>`<button class="choice" onclick="resolveEvent('${id}',${n})">${x[0]}</button>`).join('')}`;$('#modal').classList.add('show')}
function resolveEvent(id,index){const [text,result]=CHARACTERS.find(x=>x.id===id).choices[index];let cigs=result.cigs||0;if(cigs<0&&state.perks.includes('survivor')&&state.lossShield){cigs=Math.ceil(cigs*.5);state.lossShield=false;toast('No era tan tard · pèrdua reduïda')}state.cigs=Math.max(0,state.cigs+cigs);state.respect+=(result.respect||0)*(state.perks.includes('tongue')?1.2:1);state.xp+=result.xp;state.stats[result.stat]+=result.amount;state.seen.push(id);closeModal();toast(`${text} · ${statName(result.stat)} +${result.amount}`);render()}
function closeModal(){$('#modal').classList.remove('show')}
function buyItem(id){const i=ITEMS.find(x=>x.id===id);if(state.owned.includes(id))return;const wallet=i.currency==='cigs'?'cigs':'respect';if(state[wallet]<i.cost)return toast('Et falta '+(i.currency==='cigs'?'calades.':'respecte.'));state[wallet]-=i.cost;state.owned.push(id);state.equipped[i.slot]=id;toast(`${i.name} equipat`);render()}
function choosePerk(id){if(state.perks.includes(id))return;state.perks.push(id);toast('Perk desbloquejat');render()}
$('#smokeButton').onclick=addClick;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
window.openEvent=openEvent;window.resolveEvent=resolveEvent;window.closeModal=closeModal;window.buyItem=buyItem;window.choosePerk=choosePerk;render();
</script>
</body></html>
